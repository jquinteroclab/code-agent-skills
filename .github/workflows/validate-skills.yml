name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canonical-template:
    name: Plantilla canónica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: `git diff --check <base>...HEAD` necesita el
          # ancestro común, y un clone superficial no lo tiene ("no merge base").
          fetch-depth: 0

      - name: Validar todas las skills contra _template/SKILL.md
        run: ./scripts/validate-skills.sh

      - name: Sanidad del diff (trailing whitespace)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
